[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-analysis-backend"
version = "0.1.0"
description = "Audio mix and mastering quality analysis service"
readme = "../README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "jinja2>=3.1,<4.0",
    "mutagen>=1.47,<2.0",
    "numpy>=2.2,<3.0",
    "pydantic>=2.11,<3.0",
    "pyloudnorm>=0.1.1,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "scipy>=1.17,<2.0",
    "soundfile>=0.13,<1.0",
    "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
